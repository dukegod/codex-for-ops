# .github/workflows/lychee.yml —— CI 死链检查
# 每个 push + 每个 PR 跑一遍 lychee，检查仓库内 Markdown 链接是否失效
# 适配 codex-for-ops（GitHub 公共仓库）：用 lychee 官方 Docker 镜像

name: Lychee Link Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消进行中的同一 workflow
concurrency:
  group: lychee-${{ github.ref }}
  cancel-in-progress: true

jobs:
  link-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缓存 lychee 运行结果（加速重复运行）
      - name: Cache Lychee Results
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            lychee-${{ github.ref }}-
            lychee-

      # lychee 0.24 把 inputs 当 regex / 内部 glob 解析，跟 shell **/*.md 不兼容。
      # 参考 ai-handbook 方案：先 find 列文件清单到临时文件，再 --files-from 喂 lychee。
      - name: Build .md file list
        run: |
          find . \
            -name "*.md" \
            -not -path "./node_modules/*" \
            -not -path "./.vitepress/*" \
            -not -path "./.lycheecache/*" \
            -not -path "./public/*" \
            -not -path "./assets/*" \
            > /tmp/lychee-md-files.txt
          echo "Found $(wc -l < /tmp/lychee-md-files.txt) .md files"

      - name: Run Lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config lychee.toml
            --root-dir ${{ github.workspace }}
            --files-from /tmp/lychee-md-files.txt
          fail: true
          output: detailed
          jobSummary: true
